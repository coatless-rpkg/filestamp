<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 150" role="img" aria-labelledby="t d">
  <title id="t">stamp_update revises a header in place</title>
  <desc id="d">Before and after cards showing a bumped copyright year and an added author.</desc>
  <style>
    .s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}
    .lbl{letter-spacing:.10em;font-weight:700;font-size:11px}
    .cap{font-size:11px}
    .ink{fill:#E9DFCE}.fn{fill:#6FB2D6}.key{fill:#CE9A6A}.str{fill:#A3C07A}.num{fill:#E0A24E}
    .com{fill:#8A7E6C}.var{fill:#E0A24E;font-weight:600}.stamp{fill:#E4726E}.faint{fill:#8A7E6C}
    .card{fill:#221913;stroke:#3A2C20}
    .badge{fill:#C63A43}.bnum{fill:#FBF8F2}.accent{fill:#E4726E}.astroke{stroke:#E4726E}
    .chip{fill:#2A2016;stroke:#3A2C20}.ok{fill:#E4726E}.skip{fill:#8A7E6C}
  </style>

  <circle class="badge" cx="32" cy="18" r="9"/><text class="s bnum" x="32" y="21.5" font-size="10.5" font-weight="700" text-anchor="middle">1</text>
  <text class="s lbl ink" x="48" y="22">BEFORE</text>
  <rect class="card" x="24" y="44" width="204" height="60" rx="8" stroke-width="1"/>
  <text class="m com" x="42" y="68" xml:space="preserve"># Copyright (c) 2020</text>
  <text class="m com" x="42" y="86" xml:space="preserve"># Author: Jane Doe</text>

  <text class="s faint cap" x="286" y="60" text-anchor="middle">stamp_update()</text>
  <path class="astroke" d="M244 74 H318" stroke-width="2"/>
  <path class="accent" d="M318 69.5 L326 74 L318 78.5 z"/>

  <circle class="badge" cx="348" cy="18" r="9"/><text class="s bnum" x="348" y="21.5" font-size="10.5" font-weight="700" text-anchor="middle">2</text>
  <text class="s lbl ink" x="364" y="22">AFTER</text>
  <rect class="card" x="340" y="44" width="222" height="60" rx="8" stroke-width="1"/>
  <rect class="accent" x="350" y="56" width="2.5" height="36" rx="1.25"/>
  <text class="m" x="366" y="68" xml:space="preserve"><tspan class="ink"># Copyright (c) </tspan><tspan class="stamp">2020-2026</tspan></text>
  <text class="m" x="366" y="86" xml:space="preserve"><tspan class="ink"># Author: Jane Doe </tspan><tspan class="stamp">and Sam</tspan></text>

  <text class="s faint cap" x="24" y="128">Bump years and add authors in place.</text>
</svg>
