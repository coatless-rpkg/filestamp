url: https://r-pkg.thecoatlessprofessor.com/filestamp

template:
  bootstrap: 5
  light-switch: true
  bslib:
    # Light mode: cream paper, warm-dark ink, crimson stamp accent
    bg: "#FBF8F2"
    fg: "#241A12"
    primary: "#A31621"
    border-radius: "0.5rem"
    btn-border-radius: "0.375rem"

navbar:
  structure:
    right: [search, lightswitch, github]

reference:
- title: Stamp files and directories
  desc: >
    Add a header to a single file or to every file in a directory.
  contents:
  - stamp
  - stamp_file
  - stamp_dir

- title: Update existing headers
  desc: >
    Revise a header that is already in a file, changing only the fields you name.
  contents:
  - stamp_update
  - stamp_bump_year
  - stamp_add_author
  - stamp_edits
  - year_extend
  - author_add

- title: Templates
  desc: >
    Choose a built-in license template or build your own.
  contents:
  - stamp_templates
  - stamp_template_default
  - stamp_template_load
  - stamp_template_create
  - stamp_template_describe
  - stamp_template_field
  - stamp_template_content

- title: Variables
  desc: >
    The values that fill a template's `{{...}}` placeholders.
  contents:
  - stamp_variables
  - stamp_variables_add
  - stamp_variables_list

- title: Languages
  desc: >
    Detect a file's comment style and register new languages.
  contents:
  - languages
  - detect_language
  - language_register
  - language_get

- title: Inspecting files
  contents:
  - has_header
  - is_file
  - backup_file

- title: Print methods
  contents:
  - starts_with("print.")

articles:
- title: Articles
  navbar: ~
  contents:
  - filestamp
  - licenses-and-templates
  - language-support
  - maintaining-headers
