<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 222" role="img" aria-labelledby="t d">
  <title id="t">Directory stamping</title>
  <desc id="d">One call stamps an entire directory tree; files whose type filestamp does not recognize, like data.json, are skipped rather than stamped.</desc>
  <style>
    .s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}
    .lbl{letter-spacing:.10em;font-weight:700;font-size:11px}
    .cap{font-size:11px}
    .ink{fill:#E9DFCE}.fn{fill:#6FB2D6}.key{fill:#CE9A6A}.str{fill:#A3C07A}.num{fill:#E0A24E}
    .com{fill:#8A7E6C}.var{fill:#E0A24E;font-weight:600}.stamp{fill:#E4726E}.faint{fill:#8A7E6C}
    .card{fill:#221913;stroke:#3A2C20}
    .badge{fill:#C63A43}.bnum{fill:#FBF8F2}.accent{fill:#E4726E}.astroke{stroke:#E4726E}
    .chip{fill:#2A2016;stroke:#3A2C20}.ok{fill:#E4726E}.skip{fill:#8A7E6C}
  </style>

  <!-- STEP 1 -->
  <circle class="badge" cx="32" cy="18" r="9"/><text class="s bnum" x="32" y="21.5" font-size="10.5" font-weight="700" text-anchor="middle">1</text>
  <text class="s lbl ink" x="48" y="22">ONE CALL</text>
  <rect class="card" x="24" y="44" width="236" height="58" rx="8" stroke-width="1"/>
  <text class="m" x="42" y="68" xml:space="preserve"><tspan class="fn">stamp_dir</tspan><tspan class="ink">(</tspan><tspan class="str">"src/"</tspan><tspan class="ink">,</tspan></text>
  <text class="m" x="42" y="86" xml:space="preserve"><tspan class="ink">  recursive = </tspan><tspan class="num">TRUE</tspan><tspan class="ink">)</tspan></text>

  <!-- ARROW -->
  <path class="astroke" d="M264 73 H276" stroke-width="2"/>
  <path class="accent" d="M276 68.5 L284 73 L276 77.5 z"/>

  <!-- STEP 2 -->
  <circle class="badge" cx="316" cy="18" r="9"/><text class="s bnum" x="316" y="21.5" font-size="10.5" font-weight="700" text-anchor="middle">2</text>
  <text class="s lbl ink" x="332" y="22">EVERY FILE</text>
  <rect class="card" x="308" y="44" width="248" height="150" rx="8" stroke-width="1"/>

  <text class="m ink" x="326" y="66" xml:space="preserve">src/</text>
  <text class="m" x="326" y="84"  xml:space="preserve"><tspan class="com">├─ </tspan><tspan class="ink">app.R</tspan></text>
  <circle class="ok" cx="530" cy="80" r="2.7"/>
  <text class="m" x="326" y="102" xml:space="preserve"><tspan class="com">├─ </tspan><tspan class="ink">core/</tspan></text>
  <text class="m" x="326" y="120" xml:space="preserve"><tspan class="com">│  ├─ </tspan><tspan class="ink">utils.R</tspan></text>
  <circle class="ok" cx="530" cy="116" r="2.7"/>
  <text class="m" x="326" y="138" xml:space="preserve"><tspan class="com">│  └─ </tspan><tspan class="ink">db.sql</tspan></text>
  <circle class="ok" cx="530" cy="134" r="2.7"/>
  <text class="m" x="326" y="156" xml:space="preserve"><tspan class="com">├─ </tspan><tspan class="ink">styles.css</tspan></text>
  <circle class="ok" cx="530" cy="152" r="2.7"/>
  <text class="m" x="326" y="174" xml:space="preserve"><tspan class="com">└─ </tspan><tspan class="skip">data.json</tspan></text>
  <text class="m skip" x="496" y="174" xml:space="preserve">skipped</text>

  <text class="s faint cap" x="308" y="212">Unknown types are skipped, never corrupted.</text>
</svg>
